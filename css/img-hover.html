<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>

.img-container {
  position: relative;
  width: 50%;
}

.img {
  opacity: 1;
  display: block;
  width: 100%;
  height: auto;
  transition: .5s ease;
  backface-visibility: hidden;
}

.img-middle {
  transition: .5s ease;
  opacity: 0;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  -ms-transform: translate(-50%, -50%);
  text-align: center;
}

.img-container:hover .image {
  opacity: 0.3;
}

.img-container:hover .img-middle {
  opacity: 1;
}

.text{
  background-color: #04AA6D;
  color: white;
  font-size: 16px;
  padding: 16px 32px;
}


</style>
</head>
<body>

<h2>Opacity with Box</h2>
<p>Hover over the image to see the effect.</p>

<div class="img-container">
    <a href="badesalt-rosenblade.html"><img class="forsidebillede" src="img/rosenbadesalt.png" alt="Et glas med badesalt og tørrede rosenblade"></a>
    <div class="img-middle">
        <a href="badesalt-rosenblade.html"><div class="text">Badesalt med rosenblade</div></a>
    </div>
</div>



</body>
</html>
